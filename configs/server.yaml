app:
  host: "0.0.0.0"
  port: 8080
  command_hz: 100.0

robot:
  ip: "10.147.4.153"
  backend: "zmq"

control:
  head_sensitivity: -0.002

profiles:
  pause: {}
  teleoperation:
    forward_throttle: 0.3
    backward_throttle: -0.15
    forward_fast_throttle: 0.5
  teleop_slam:
    forward_throttle: 0.3
    backward_throttle: -0.15
    forward_fast_throttle: 0.5
  autonomy_profile_1: {}
  following:
    friend_embeddings_db: "data/friends.db"
    approach_distance_m: 1.0
    max_head_tilt_deg: 60.0
    average_human_height_m: 1.7
    yolo_model: "yolov8n.pt"
  staring:
    forward_throttle: 0.3
    backward_throttle: -0.15
    forward_fast_throttle: 0.5
    friend_embeddings_db: "data/friends.db"
    face_match_threshold: 0.5
    head_tracking_gain: 1.5
    head_tracking_deadzone: 0.1
    bbox_target_x_frac: 0.5
    bbox_target_y_frac: 0.1
    latency_compensation_cap_frac: 0.3

network:
  grafana_url: ""
  bind_address: "0.0.0.0"
  telemetry_port: 5550
  command_port: 5552
  report_port: 5553
  recv_timeout_ms: 100
  send_high_water_mark: 2
  recv_high_water_mark: 1

# SLAM: если уверенность клиента в одометрии (odom_confidence) < порог — в TF подаётся pose из slam_toolbox
slam:
  odom_confidence_threshold: 0.5

# Vision node: все параметры задаются здесь, без значений по умолчанию в launch
vision:
  yolo_model: "/home/kir/Leosha/models/yolo11n-pose.pt"
  yolo_device: "intel:cpu"
  yolo_conf: 0.5
  yolo_imgsz: 320
  tracker: "bytetrack.yaml"
  enable_face_embedding: false
  face_model: ""
  embedding_interval: 25
  face_min_confidence: 0.5
  head_yaw_min_deg: -45.0
  head_yaw_max_deg: 45.0
  head_yaw_scale_deg: 57.2958
  face_crop_ratio: 0.45
  embedding_input_size: 112
  embedding_norm_mean: 127.5
  embedding_norm_std: 128.0
  yaw_eye_dx_epsilon: 1.0e-6
  log_level: "INFO"
