app:
  telemetry_hz: 30.0
  command_hz: 100.0

watchdog:
  warn_ms: 50.0
  timeout_ms: 100.0
  critical_ms: 500.0

diagnostics:
  battery_voltage: 5.0
  cpu_temp_c: 50.0 # примерное значение
  wifi_rssi_dbm: -44.0 # примерное значение

network:
  server_host: "192.168.31.70"
  telemetry_port: 5550
  command_port: 5552
  report_port: 5553
  recv_timeout_ms: 0
  send_high_water_mark: 2
  recv_high_water_mark: 1

actuators:
  backend: "pca9685"
  pca:
    channels: 16
    frequency: 250
  motor:
    channel: 0
    zero_throttle: 0.05
    speed_to_throttle_ratio: 0.85
    pwm_min_pulse: 1000
    pwm_max_pulse: 2000
  wheel:
    channel: 1
    min_throttle: -1.0
    zero_throttle: 0.0
    max_throttle: 1.0
    pwm_min_pulse: 1000
    pwm_max_pulse: 2000
    invert: true
  neck:
    channel: 3
    angle_zero: 135.0
    actuation_range: 360
    pwm_min_pulse: 300
    pwm_max_pulse: 1800
  face:
    channel: 2
    angle_zero: 15.0
    actuation_range: 90
    pwm_min_pulse: 1000
    pwm_max_pulse: 2000

robot_geometry:
  body_size:
    length: 0.19
    width: 0.18
    height: 0.16
  pose_on_body:
    x: 0.0
    y: 0.0
    z: 0.0
  wheel:
    radius: 0.07
    width: 0.025
  lidar:
    position:
      x: 0.08
      y: 0.0
      z: 0.12
    blind_zone:
      angle_start_deg: 150.0
      angle_end_deg: -150.0
      max_distance_m: 0.12
  head:
    position:
      x: 0.12
      y: 0.0
      z: 0.17
    neck_min_deg: -45.0
    neck_max_deg: 45.0
    face_min_deg: -15.0
    face_max_deg: 75.0

sensors:
  camera:
    enabled: true
    required_for_motion: false
    fps: 30.0
    resolution: [640, 480]
    tuning_file: "/usr/share/libcamera/ipa/rpi/pisp/imx290.json"
    exposure_time: 10000
    analogue_gain: 50.0
    awb_enable: true
    ae_enable: false
    jpeg_quality: 70
    healthcheck_timeout_sec: 25.0
    healthcheck_test_timeout_sec: 25.0
    healthcheck_min_frames: 2
    fail_policy:
      max_consecutive_failures: 3
      auto_disable_on_fail: true
      retry_interval_sec: 1.0
  lidar:
    enabled: true
    required_for_motion: true
    port: "/dev/ydlidar"
    auto_discover_port: true
    baudrate: 230400
    scan_hz: 10.0
    min_angle_deg: -180.0
    max_angle_deg: 180.0
    range_min_m: 0.02
    range_max_m: 6.0
    intensity_enabled: true
    invert_angle: false
    zero_angle_deg: -90  # угол «вперёд» в сырых градусах лидара; после сдвига на нём будет 0°
    healthcheck_timeout_sec: 10.0
    healthcheck_test_timeout_sec: 15.0
    healthcheck_min_points: 32
    fail_policy:
      max_consecutive_failures: 3
      auto_disable_on_fail: true
      retry_interval_sec: 1.0
  imu:
    enabled: true
    required_for_motion: false
    hz: 100.0
    fail_policy:
      max_consecutive_failures: 10
      auto_disable_on_fail: false
      retry_interval_sec: 0.2
  encoder:
    enabled: true
    required_for_motion: false
    hz: 100.0
    fail_policy:
      max_consecutive_failures: 10
      auto_disable_on_fail: false
      retry_interval_sec: 0.2
  ultrasonic:
    enabled: true
    required_for_motion: true
    hz: 10.0
    emergency_stop_distance_m: 0.2
    fail_policy:
      max_consecutive_failures: 5
      auto_disable_on_fail: false
      retry_interval_sec: 0.5
