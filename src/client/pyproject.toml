[tool.poetry]
name = "leo-client"
version = "2.0.0"
description = "Thin LEO robot client. It applies physical commands and returns sensors."
authors = ["LEO <leo@example.com>"]
packages = [{include = "leo_client"}]

[tool.poetry.dependencies]
python = ">=3.10"
leo-protocol = {path = "../shared", develop = true}
numpy = ">=1.21,<1.25"
pyzmq = ">=22.0"
opencv-python-headless = ">=4.5,<4.11"
pygame = {version = ">=2.5", optional = true}
adafruit-circuitpython-servokit = {version = ">=1.3", optional = true}
lgpio = {version = ">=0.2.2", optional = true}
picamera2 = {version = ">=0.3", optional = true}
ydlidar = {git = "https://github.com/YDLIDAR/YDLidar-SDK.git", tag = "V1.2.7", optional = true}

[tool.poetry.extras]
sim = ["pygame"]
robot = ["adafruit-circuitpython-servokit", "lgpio", "picamera2", "ydlidar"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0,<8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
