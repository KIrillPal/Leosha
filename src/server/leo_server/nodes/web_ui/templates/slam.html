{% extends "base.html" %}
{% block body %}
<style>
  .slam-wrap { display: grid; gap: 12px; grid-template-columns: 1fr 280px; }
  .slam-card { background: #0a0f1e; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; }
  #map { width: 100%; height: 70vh; object-fit: contain; display: block; border-radius: 10px; background: #1e293b; image-rendering: pixelated; }
  @media (max-width: 900px) { .slam-wrap { grid-template-columns: 1fr; } }
</style>
<div class="slam-wrap">
  <div class="slam-card"><img id="map" alt="Occupancy map"></div>
  <div class="card">
    <h3>Map</h3>
    <p class="hint">The picture is the occupancy grid from <code>/map</code>. It appears while a SLAM mode is running.</p>
  </div>
</div>
<script>
setInterval(() => { document.getElementById('map').src = '/api/map?t=' + Date.now(); }, 500);
</script>
{% endblock %}
