{% extends "base.html" %}
{% block body %}
<style>
  .lidar-wrap { display: grid; gap: 12px; grid-template-columns: 1fr 280px; }
  .lidar-card { background: #0a0f1e; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; }
  #lidarCanvas { width: 100%; height: 70vh; display: block; border-radius: 10px; background: radial-gradient(circle at center, #101a34 0%, #090f20 65%, #060b18 100%); }
  @media (max-width: 900px) { .lidar-wrap { grid-template-columns: 1fr; } }
</style>
<div class="lidar-wrap">
  <div class="lidar-card"><canvas id="lidarCanvas"></canvas></div>
  <div class="card">
    <h3>LiDAR</h3>
    <p class="hint">Points</p>
    <p class="metric" id="points">0</p>
    <p class="hint">Range (m)</p>
    <p class="metric"><span id="rangeMin">0</span> .. <span id="rangeMax">0</span></p>
    <p class="hint">Angle span (deg)</p>
    <p class="metric"><span id="angleMin">0</span> .. <span id="angleMax">0</span></p>
    <p class="hint">0° is forward, at the top.</p>
  </div>
</div>
<script>
const canvas = document.getElementById('lidarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(320, Math.floor(rect.width));
  canvas.height = Math.max(320, Math.floor(rect.height));
}

function dataToCanvas(dataAngleRad) {
  return dataAngleRad + Math.PI / 2;
}

function drawGrid(centerX, centerY, radiusPx, rangeMaxM) {
  const rMax = Math.max(0.1, Number(rangeMaxM || 6));
  ctx.save();
  ctx.strokeStyle = 'rgba(125, 211, 252, 0.12)';
  ctx.lineWidth = 1;
  for (let i = 1; i <= 5; i += 1) {
    ctx.beginPath();
    ctx.arc(centerX, centerY, radiusPx * (i / 5), 0, Math.PI * 2);
    ctx.stroke();
  }
  for (let deg = -180; deg < 180; deg += 30) {
    const a = dataToCanvas((deg * Math.PI) / 180);
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX + Math.cos(a) * radiusPx, centerY - Math.sin(a) * radiusPx);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(125, 211, 252, 0.55)';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  for (let i = 1; i <= 5; i += 1) {
    const distM = rMax * i / 5;
    const label = distM >= 1 ? distM.toFixed(1) + ' m' : (distM * 100).toFixed(0) + ' cm';
    ctx.fillText(label, centerX + radiusPx * (i / 5) + 8, centerY);
  }
  ctx.textAlign = 'center';
  const labelRadius = radiusPx * 1.06;
  for (let deg = -180; deg < 180; deg += 30) {
    const a = dataToCanvas((deg * Math.PI) / 180);
    ctx.fillText(deg + '°', centerX + Math.cos(a) * labelRadius, centerY - Math.sin(a) * labelRadius);
  }
  ctx.restore();
}

function toColor(intensity) {
  const factor = Math.max(0, Math.min(1, intensity / 255));
  const hue = 240 - 240 * factor;
  return `hsla(${hue}, 95%, 62%, 0.95)`;
}

function drawScan(scan) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const rMax = Math.max(0.1, Number(scan.range_max || 6));
  const radiusPx = Math.min(canvas.width, canvas.height) * 0.45;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGrid(cx, cy, radiusPx, rMax);
  const ranges = Array.isArray(scan.ranges) ? scan.ranges : [];
  const intensities = Array.isArray(scan.intensities) ? scan.intensities : [];
  const aMin = Number(scan.angle_min || 0);
  const aInc = Number(scan.angle_increment || 0);
  const shadowWidth = (5 * Math.PI) / 180;
  for (let i = 0; i < ranges.length; i += 1) {
    const dist = Number(ranges[i]);
    if (!Number.isFinite(dist) || dist <= 0) continue;
    const angle = dataToCanvas(aMin + aInc * i);
    const reach = Math.min(1, dist / rMax);
    const x = cx + Math.cos(angle) * radiusPx * reach;
    const y = cy - Math.sin(angle) * radiusPx * reach;
    const outerX1 = cx + Math.cos(angle - shadowWidth / 2) * radiusPx;
    const outerY1 = cy - Math.sin(angle - shadowWidth / 2) * radiusPx;
    const outerX2 = cx + Math.cos(angle + shadowWidth / 2) * radiusPx;
    const outerY2 = cy - Math.sin(angle + shadowWidth / 2) * radiusPx;
    ctx.fillStyle = 'rgba(16, 185, 129, 0.04)';
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(outerX1, outerY1);
    ctx.lineTo(outerX2, outerY2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = toColor(Number(intensities[i] || 0));
    ctx.beginPath();
    ctx.arc(x, y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

async function refreshLidar() {
  resizeCanvas();
  let scan;
  try {
    scan = await (await fetch('/api/lidar')).json();
  } catch (err) {
    return;
  }
  const ranges = Array.isArray(scan.ranges) ? scan.ranges : [];
  const aMin = Number(scan.angle_min || 0);
  const aInc = Number(scan.angle_increment || 0);
  const aMax = ranges.length ? aMin + aInc * (ranges.length - 1) : aMin;
  document.getElementById('points').textContent = ranges.filter((value) => Number.isFinite(Number(value)) && Number(value) > 0).length;
  document.getElementById('rangeMin').textContent = Number(scan.range_min || 0).toFixed(2);
  document.getElementById('rangeMax').textContent = Number(scan.range_max || 0).toFixed(2);
  const minDeg = Math.min(aMin, aMax) * 180 / Math.PI;
  const maxDeg = Math.max(aMin, aMax) * 180 / Math.PI;
  document.getElementById('angleMin').textContent = minDeg.toFixed(1);
  document.getElementById('angleMax').textContent = maxDeg.toFixed(1);
  drawScan(scan);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
refreshLidar();
setInterval(refreshLidar, 100);
</script>
{% endblock %}
